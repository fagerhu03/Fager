<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 812" width="100%" height="100%">
  <!-- Background -->
  <rect width="375" height="812" fill="#0f172a"/>

  <!-- App Header -->
  <g transform="translate(24, 55)">
    <text x="0" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="22" fill="#f8fafc">My Events &amp; Tasks</text>
    <text x="0" y="40" font-family="sans-serif" font-size="12" fill="#94a3b8">Wednesday, Oct 1 • 6 Tasks Pending</text>

    <!-- Hive Offline Sync Pill -->
    <rect x="235" y="10" width="92" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <circle cx="248" cy="23" r="4" fill="#10b981"/>
    <text x="272" y="27" font-family="sans-serif" font-weight="600" font-size="10" fill="#38bdf8">Hive Synced</text>
  </g>

  <!-- Search and Category Filters -->
  <g transform="translate(24, 115)">
    <rect width="327" height="42" rx="12" fill="#1e293b"/>
    <circle cx="20" cy="21" r="6" fill="none" stroke="#64748b" stroke-width="2"/>
    <line x1="24" y1="25" x2="30" y2="31" stroke="#64748b" stroke-width="2"/>
    <text x="40" y="25" font-family="sans-serif" font-size="12" fill="#64748b">Search events or tags...</text>
  </g>

  <!-- Category Pills -->
  <g transform="translate(24, 172)">
    <rect x="0" y="0" width="55" height="30" rx="15" fill="#0284c7"/>
    <text x="27" y="19" font-family="sans-serif" font-weight="700" font-size="11" fill="#fff" text-anchor="middle">All (6)</text>

    <rect x="63" y="0" width="75" height="30" rx="15" fill="#1e293b"/>
    <text x="100" y="19" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Work &amp; Tech</text>

    <rect x="146" y="0" width="85" height="30" rx="15" fill="#1e293b"/>
    <text x="188" y="19" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Route Academy</text>

    <rect x="239" y="0" width="88" height="30" rx="15" fill="#1e293b"/>
    <text x="283" y="19" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Personal</text>
  </g>

  <!-- Event Cards List -->
  <g transform="translate(24, 222)">
    <!-- Event 1: High Priority -->
    <g transform="translate(0, 0)">
      <rect width="327" height="92" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <rect x="0" y="0" width="6" height="92" rx="3" fill="#ef4444"/>
      <!-- Checkbox circle -->
      <circle cx="28" cy="46" r="11" fill="none" stroke="#64748b" stroke-width="2"/>
      <text x="52" y="32" font-family="sans-serif" font-weight="700" font-size="14" fill="#f8fafc">Sprint Architecture Review</text>
      <text x="52" y="50" font-family="sans-serif" font-size="11" fill="#94a3b8">Finalize Clean Architecture &amp; Bloc state</text>
      
      <!-- Time and notification badge -->
      <text x="52" y="74" font-family="sans-serif" font-weight="600" font-size="10" fill="#38bdf8">⏰ 10:30 AM • Firebase Live Sync</text>
      <rect x="245" y="60" width="70" height="20" rx="6" fill="rgba(239,68,68,0.15)"/>
      <text x="280" y="74" font-family="sans-serif" font-weight="700" font-size="9" fill="#ef4444" text-anchor="middle">High Priority</text>
    </g>

    <!-- Event 2: Route Academy Submission -->
    <g transform="translate(0, 106)">
      <rect width="327" height="92" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <rect x="0" y="0" width="6" height="92" rx="3" fill="#0284c7"/>
      <!-- Checkbox circle completed -->
      <circle cx="28" cy="46" r="11" fill="#10b981"/>
      <text x="28" y="50" font-family="sans-serif" font-weight="800" font-size="12" fill="#fff" text-anchor="middle">✓</text>
      <text x="52" y="32" font-family="sans-serif" font-weight="700" font-size="14" fill="#94a3b8" text-decoration="line-through">Mobile Diploma Project Build</text>
      <text x="52" y="50" font-family="sans-serif" font-size="11" fill="#64748b">Hive offline storage &amp; auth integration</text>
      <text x="52" y="74" font-family="sans-serif" font-weight="600" font-size="10" fill="#10b981">✓ Completed • Synced to Hive</text>
      <rect x="245" y="60" width="70" height="20" rx="6" fill="rgba(16,185,129,0.15)"/>
      <text x="280" y="74" font-family="sans-serif" font-weight="700" font-size="9" fill="#10b981" text-anchor="middle">Done</text>
    </g>

    <!-- Event 3: Engineering Graduation Meet -->
    <g transform="translate(0, 212)">
      <rect width="327" height="92" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <rect x="0" y="0" width="6" height="92" rx="3" fill="#f59e0b"/>
      <circle cx="28" cy="46" r="11" fill="none" stroke="#64748b" stroke-width="2"/>
      <text x="52" y="32" font-family="sans-serif" font-weight="700" font-size="14" fill="#f8fafc">Tourism App Team Sync</text>
      <text x="52" y="50" font-family="sans-serif" font-size="11" fill="#94a3b8">Coordinate CV model &amp; Google Maps routes</text>
      <text x="52" y="74" font-family="sans-serif" font-weight="600" font-size="10" fill="#f59e0b">⏰ 03:00 PM • Reminders ON</text>
      <rect x="245" y="60" width="70" height="20" rx="6" fill="rgba(245,158,11,0.15)"/>
      <text x="280" y="74" font-family="sans-serif" font-weight="700" font-size="9" fill="#f59e0b" text-anchor="middle">Medium</text>
    </g>

    <!-- Event 4: Offline Hive Storage Backup -->
    <g transform="translate(0, 318)">
      <rect width="327" height="92" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <rect x="0" y="0" width="6" height="92" rx="3" fill="#8b5cf6"/>
      <circle cx="28" cy="46" r="11" fill="none" stroke="#64748b" stroke-width="2"/>
      <text x="52" y="32" font-family="sans-serif" font-weight="700" font-size="14" fill="#f8fafc">Local Cache Optimization</text>
      <text x="52" y="50" font-family="sans-serif" font-size="11" fill="#94a3b8">Benchmark Hive box reading speed vs SQLite</text>
      <text x="52" y="74" font-family="sans-serif" font-weight="600" font-size="10" fill="#38bdf8">⏰ 07:00 PM • Fast IO</text>
      <rect x="245" y="60" width="70" height="20" rx="6" fill="rgba(139,92,246,0.15)"/>
      <text x="280" y="74" font-family="sans-serif" font-weight="700" font-size="9" fill="#8b5cf6" text-anchor="middle">Storage</text>
    </g>
  </g>

  <!-- Floating Action Button (Flutter standard) -->
  <g transform="translate(290, 680)">
    <circle cx="28" cy="28" r="28" fill="#0284c7" filter="drop-shadow(0px 8px 16px rgba(2,132,199,0.4))"/>
    <text x="28" y="36" font-family="sans-serif" font-weight="400" font-size="28" fill="#fff" text-anchor="middle">+</text>
  </g>

  <!-- Bottom Navigation Bar -->
  <g transform="translate(0, 745)">
    <rect width="375" height="67" fill="#0b1329"/>
    <circle cx="80" cy="22" r="3" fill="#38bdf8"/>
    <text x="80" y="38" font-family="sans-serif" font-weight="700" font-size="10" fill="#38bdf8" text-anchor="middle">Events</text>
    <text x="187" y="38" font-family="sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Calendar</text>
    <text x="295" y="38" font-family="sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Settings</text>
  </g>
</svg>
