<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 812" width="100%" height="100%">
  <!-- Background -->
  <rect width="375" height="812" fill="#061a14"/>

  <!-- Top Bar -->
  <g transform="translate(24, 52)">
    <text x="0" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="20" fill="#f8fafc">Holy Quran</text>
    <text x="0" y="36" font-family="sans-serif" font-size="11" fill="#34d399">Surahs &amp; Verses • Clean Architecture</text>
  </g>

  <!-- Surah Search -->
  <g transform="translate(24, 105)">
    <rect width="327" height="42" rx="12" fill="#0b2920" stroke="#059669" stroke-width="1"/>
    <text x="16" y="26" font-family="sans-serif" font-size="12" fill="#6ee7b7">Search Surah by name or number...</text>
  </g>

  <!-- Surahs List -->
  <g transform="translate(24, 165)">
    <!-- Surah 1: Al-Fatihah -->
    <g transform="translate(0, 0)">
      <rect width="327" height="74" rx="14" fill="#0b2920" stroke="#059669" stroke-width="0.8"/>
      <circle cx="28" cy="37" r="16" fill="#064e3b"/>
      <text x="28" y="42" font-family="sans-serif" font-weight="700" font-size="11" fill="#34d399" text-anchor="middle">1</text>
      
      <text x="56" y="30" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="14" fill="#ffffff">Al-Fatihah</text>
      <text x="56" y="48" font-family="sans-serif" font-size="11" fill="#6ee7b7">The Opening • 7 Verses</text>
      
      <!-- Arabic Title -->
      <text x="305" y="42" font-family="serif" font-weight="bold" font-size="16" fill="#ecfdf5" text-anchor="end">الفاتحة</text>
    </g>

    <!-- Surah 2: Al-Baqarah -->
    <g transform="translate(0, 84)">
      <rect width="327" height="74" rx="14" fill="#0b2920" stroke="#059669" stroke-width="0.8"/>
      <circle cx="28" cy="37" r="16" fill="#064e3b"/>
      <text x="28" y="42" font-family="sans-serif" font-weight="700" font-size="11" fill="#34d399" text-anchor="middle">2</text>
      
      <text x="56" y="30" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="14" fill="#ffffff">Al-Baqarah</text>
      <text x="56" y="48" font-family="sans-serif" font-size="11" fill="#6ee7b7">The Cow • 286 Verses</text>
      
      <text x="305" y="42" font-family="serif" font-weight="bold" font-size="16" fill="#ecfdf5" text-anchor="end">البقرة</text>
    </g>

    <!-- Surah 3: Ali 'Imran -->
    <g transform="translate(0, 168)">
      <rect width="327" height="74" rx="14" fill="#0b2920" stroke="#059669" stroke-width="0.8"/>
      <circle cx="28" cy="37" r="16" fill="#064e3b"/>
      <text x="28" y="42" font-family="sans-serif" font-weight="700" font-size="11" fill="#34d399" text-anchor="middle">3</text>
      
      <text x="56" y="30" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="14" fill="#ffffff">Ali 'Imran</text>
      <text x="56" y="48" font-family="sans-serif" font-size="11" fill="#6ee7b7">Family of Imran • 200 Verses</text>
      
      <text x="305" y="42" font-family="serif" font-weight="bold" font-size="16" fill="#ecfdf5" text-anchor="end">آل عمران</text>
    </g>

    <!-- Surah 4: An-Nisa -->
    <g transform="translate(0, 252)">
      <rect width="327" height="74" rx="14" fill="#0b2920" stroke="#059669" stroke-width="0.8"/>
      <circle cx="28" cy="37" r="16" fill="#064e3b"/>
      <text x="28" y="42" font-family="sans-serif" font-weight="700" font-size="11" fill="#34d399" text-anchor="middle">4</text>
      
      <text x="56" y="30" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="14" fill="#ffffff">An-Nisa</text>
      <text x="56" y="48" font-family="sans-serif" font-size="11" fill="#6ee7b7">The Women • 176 Verses</text>
      
      <text x="305" y="42" font-family="serif" font-weight="bold" font-size="16" fill="#ecfdf5" text-anchor="end">النساء</text>
    </g>
  </g>

  <!-- Digital Sebha Interactive Card Preview -->
  <g transform="translate(24, 520)">
    <rect width="327" height="200" rx="18" fill="#064e3b" stroke="#34d399" stroke-width="1"/>
    
    <g transform="translate(20, 20)">
      <text x="0" y="16" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="14" fill="#ffffff">Electronic Sebha (Tasbeeh)</text>
      <text x="0" y="34" font-family="sans-serif" font-size="11" fill="#a7f3d0">Current Dhikr: Subhan Allah wa bihamdihi</text>
      
      <!-- Counter Ring Circle -->
      <circle cx="143" cy="95" r="42" fill="none" stroke="#0b2920" stroke-width="8"/>
      <circle cx="143" cy="95" r="42" fill="none" stroke="#34d399" stroke-width="8" stroke-dasharray="190" stroke-dashoffset="60"/>
      <text x="143" y="102" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="24" fill="#ffffff" text-anchor="middle">24</text>
      <text x="143" y="118" font-family="sans-serif" font-size="9" fill="#a7f3d0" text-anchor="middle">/ 33</text>
    </g>
  </g>

  <!-- Bottom Nav -->
  <g transform="translate(0, 745)">
    <rect width="375" height="67" fill="#04120e"/>
    <text x="60" y="36" font-family="sans-serif" font-size="11" fill="#6ee7b7" opacity="0.6" text-anchor="middle">Prayers</text>
    <text x="187" y="36" font-family="sans-serif" font-weight="700" font-size="11" fill="#34d399" text-anchor="middle">Quran</text>
    <text x="315" y="36" font-family="sans-serif" font-size="11" fill="#6ee7b7" opacity="0.6" text-anchor="middle">Sebha</text>
  </g>
</svg>
