<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 812" width="100%" height="100%">
  <!-- Background -->
  <rect width="375" height="812" fill="#0f172a"/>

  <!-- App Bar with Back Arrow -->
  <g transform="translate(24, 52)">
    <circle cx="16" cy="16" r="16" fill="#1e293b"/>
    <text x="16" y="21" font-family="sans-serif" font-size="16" fill="#fff" text-anchor="middle">←</text>
    <text x="50" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="16" fill="#f8fafc">Event Details</text>
    <rect x="250" y="2" width="75" height="28" rx="14" fill="#0284c7"/>
    <text x="287" y="19" font-family="sans-serif" font-weight="700" font-size="11" fill="#fff" text-anchor="middle">Save Task</text>
  </g>

  <!-- Main Detail Form Card -->
  <g transform="translate(24, 110)">
    <rect width="327" height="620" rx="20" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    
    <g transform="translate(20, 24)">
      <!-- Title Input Display -->
      <text x="0" y="16" font-family="sans-serif" font-weight="600" font-size="11" fill="#64748b">EVENT TITLE</text>
      <text x="0" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="18" fill="#f8fafc">Sprint Architecture Review</text>
      <line x1="0" y1="56" x2="287" y2="56" stroke="#334155" stroke-width="1"/>

      <!-- Description Display -->
      <text x="0" y="80" font-family="sans-serif" font-weight="600" font-size="11" fill="#64748b">DESCRIPTION &amp; CHECKLIST</text>
      <text x="0" y="104" font-family="sans-serif" font-size="13" fill="#cbd5e1">1. Finalize Clean Architecture boundaries</text>
      <text x="0" y="126" font-family="sans-serif" font-size="13" fill="#cbd5e1">2. Verify Hive persistent adapter schema</text>
      <text x="0" y="148" font-family="sans-serif" font-size="13" fill="#cbd5e1">3. Test Firebase real-time listeners offline</text>

      <!-- Date & Time Row -->
      <g transform="translate(0, 180)">
        <rect width="135" height="50" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        <text x="14" y="22" font-family="sans-serif" font-size="10" fill="#64748b">DATE</text>
        <text x="14" y="38" font-family="sans-serif" font-weight="700" font-size="12" fill="#f8fafc">Oct 02, 2025</text>

        <rect x="150" y="0" width="135" height="50" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        <text x="164" y="22" font-family="sans-serif" font-size="10" fill="#64748b">TIME</text>
        <text x="164" y="38" font-family="sans-serif" font-weight="700" font-size="12" fill="#f8fafc">10:30 AM</text>
      </g>

      <!-- Notification Settings -->
      <g transform="translate(0, 255)">
        <rect width="287" height="60" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        <text x="16" y="26" font-family="sans-serif" font-weight="700" font-size="13" fill="#f8fafc">Push Notifications</text>
        <text x="16" y="44" font-family="sans-serif" font-size="11" fill="#94a3b8">Notify 15 mins before event</text>
        <!-- Toggle Switch Active -->
        <rect x="225" y="18" width="46" height="24" rx="12" fill="#0284c7"/>
        <circle cx="257" cy="30" r="9" fill="#ffffff"/>
      </g>

      <!-- Storage Architecture Info Box -->
      <g transform="translate(0, 340)">
        <rect width="287" height="110" rx="14" fill="#0c172e" stroke="#0284c7" stroke-width="1"/>
        <text x="14" y="24" font-family="sans-serif" font-weight="700" font-size="11" fill="#38bdf8">ARCHITECTURE &amp; CACHE</text>
        <text x="14" y="46" font-family="sans-serif" font-size="11" fill="#cbd5e1">• Local Cache: Hive TypeAdapter (Box: events)</text>
        <text x="14" y="66" font-family="sans-serif" font-size="11" fill="#cbd5e1">• Remote Sync: Cloud Firestore Live Stream</text>
        <text x="14" y="86" font-family="sans-serif" font-size="11" fill="#cbd5e1">• Offline Mode: Fully functional with queue</text>
      </g>

      <!-- Delete Button -->
      <g transform="translate(0, 480)">
        <rect width="287" height="42" rx="12" fill="#450a0a" stroke="#ef4444" stroke-width="1"/>
        <text x="143" y="26" font-family="sans-serif" font-weight="700" font-size="12" fill="#fca5a5" text-anchor="middle">Delete Event</text>
      </g>
    </g>
  </g>

  <!-- Bottom Home Bar -->
  <rect x="120" y="795" width="135" height="4" rx="2" fill="#475569"/>
</svg>
