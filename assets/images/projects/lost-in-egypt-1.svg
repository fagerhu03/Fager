<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 812" width="100%" height="100%">
  <defs>
    <linearGradient id="egyptHero" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="375" height="812" fill="#090d16"/>

  <!-- Status Bar Space (top 44px handled by frame or screen) -->
  <!-- Top App Bar -->
  <g transform="translate(20, 52)">
    <text x="0" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="20" fill="#f8fafc">Lost in Egypt</text>
    <text x="0" y="36" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="11" fill="#38bdf8">AI Smart Tourism Companion</text>
    <!-- Language Toggle Badge -->
    <rect x="285" y="6" width="50" height="24" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="310" y="22" font-family="sans-serif" font-weight="600" font-size="10" fill="#94a3b8" text-anchor="middle">EN | AR</text>
  </g>

  <!-- Search / AI Prompt Bar -->
  <g transform="translate(20, 105)">
    <rect width="335" height="44" rx="14" fill="#151d2f" stroke="#2a3852" stroke-width="1"/>
    <circle cx="24" cy="22" r="7" fill="none" stroke="#64748b" stroke-width="2"/>
    <line x1="29" y1="27" x2="35" y2="33" stroke="#64748b" stroke-width="2"/>
    <text x="46" y="26" font-family="sans-serif" font-size="12" fill="#64748b">Where do you want to explore in Egypt?</text>
    <!-- AI badge -->
    <rect x="290" y="10" width="35" height="24" rx="8" fill="#0284c7"/>
    <text x="307" y="25" font-family="sans-serif" font-weight="700" font-size="10" fill="#fff" text-anchor="middle">AI</text>
  </g>

  <!-- AI Trip Recommendation Banner -->
  <g transform="translate(20, 165)">
    <rect width="335" height="150" rx="18" fill="url(#egyptHero)"/>
    <text x="18" y="28" font-family="sans-serif" font-weight="700" font-size="10" fill="#bae6fd" letter-spacing="1">AI PERSONALIZED ITINERARY</text>
    <text x="18" y="55" font-family="sans-serif" font-weight="800" font-size="18" fill="#ffffff">3 Days in Ancient Giza &amp; Cairo</text>
    <text x="18" y="74" font-family="sans-serif" font-size="11" fill="#e0f2fe">Optimized for history lovers &amp; photography</text>
    
    <!-- Itinerary chips -->
    <rect x="18" y="92" width="85" height="22" rx="6" fill="rgba(255,255,255,0.2)"/>
    <text x="60" y="107" font-family="sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">Pyramids &amp; Sphinx</text>

    <rect x="110" y="92" width="75" height="22" rx="6" fill="rgba(255,255,255,0.2)"/>
    <text x="147" y="107" font-family="sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">NMEC Museum</text>

    <rect x="192" y="92" width="70" height="22" rx="6" fill="rgba(255,255,255,0.2)"/>
    <text x="227" y="107" font-family="sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">Khan El-Khalili</text>

    <rect x="18" y="122" width="105" height="20" rx="10" fill="#ffffff"/>
    <text x="70" y="136" font-family="sans-serif" font-weight="700" font-size="10" fill="#0284c7" text-anchor="middle">View Full Route ➔</text>
  </g>

  <!-- Popular Landmarks Section -->
  <g transform="translate(20, 335)">
    <text x="0" y="16" font-family="sans-serif" font-weight="700" font-size="15" fill="#f8fafc">Popular Destinations</text>
    <text x="335" y="16" font-family="sans-serif" font-weight="600" font-size="11" fill="#38bdf8" text-anchor="end">See all</text>

    <!-- Card 1: Giza Plateau -->
    <g transform="translate(0, 30)">
      <rect width="160" height="180" rx="16" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1"/>
      <rect width="160" height="100" rx="16" fill="#334155"/>
      <!-- Pyramid stylized vector -->
      <polygon points="80,25 30,85 130,85" fill="#ca8a04" opacity="0.8"/>
      <polygon points="80,25 130,85 140,85" fill="#a16207" opacity="0.9"/>
      <circle cx="135" cy="30" r="10" fill="#fef08a" opacity="0.7"/>
      <text x="12" y="122" font-family="sans-serif" font-weight="700" font-size="13" fill="#f8fafc">Giza Pyramids</text>
      <text x="12" y="138" font-family="sans-serif" font-size="10" fill="#94a3b8">Giza Governorate</text>
      <text x="12" y="162" font-family="sans-serif" font-weight="700" font-size="11" fill="#eab308">★ 4.9 <tspan font-weight="400" font-size="9" fill="#64748b">(24k reviews)</tspan></text>
    </g>

    <!-- Card 2: Karnak Temple -->
    <g transform="translate(175, 30)">
      <rect width="160" height="180" rx="16" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1"/>
      <rect width="160" height="100" rx="16" fill="#1e293b"/>
      <!-- Columns stylized -->
      <rect x="40" y="35" width="12" height="50" fill="#d97706" rx="2"/>
      <rect x="65" y="35" width="12" height="50" fill="#d97706" rx="2"/>
      <rect x="90" y="35" width="12" height="50" fill="#d97706" rx="2"/>
      <rect x="115" y="35" width="12" height="50" fill="#d97706" rx="2"/>
      <rect x="30" y="30" width="105" height="8" fill="#b45309" rx="2"/>
      <text x="12" y="122" font-family="sans-serif" font-weight="700" font-size="13" fill="#f8fafc">Karnak Temple</text>
      <text x="12" y="138" font-family="sans-serif" font-size="10" fill="#94a3b8">Luxor</text>
      <text x="12" y="162" font-family="sans-serif" font-weight="700" font-size="11" fill="#eab308">★ 4.8 <tspan font-weight="400" font-size="9" fill="#64748b">(18k reviews)</tspan></text>
    </g>
  </g>

  <!-- Quick AI Camera Recognition Banner -->
  <g transform="translate(20, 565)">
    <rect width="335" height="90" rx="16" fill="#151d2f" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="5 3"/>
    <circle cx="48" cy="45" r="24" fill="#0284c7" opacity="0.2"/>
    <!-- Camera icon -->
    <rect x="38" y="37" width="20" height="16" rx="3" fill="#38bdf8"/>
    <circle cx="48" cy="45" r="4" fill="#090d16"/>
    <text x="85" y="36" font-family="sans-serif" font-weight="700" font-size="13" fill="#f8fafc">AI Landmark Scanner</text>
    <text x="85" y="52" font-family="sans-serif" font-size="11" fill="#94a3b8">Point camera at any monument for instant</text>
    <text x="85" y="66" font-family="sans-serif" font-size="11" fill="#94a3b8">history, architecture, &amp; audio guide.</text>
    <rect x="255" y="32" width="65" height="26" rx="8" fill="#0284c7"/>
    <text x="287" y="49" font-family="sans-serif" font-weight="700" font-size="10" fill="#fff" text-anchor="middle">Scan Now</text>
  </g>

  <!-- Bottom Navigation Bar -->
  <g transform="translate(0, 725)">
    <rect width="375" height="87" fill="#0d131f" stroke="#1e293b" stroke-width="1"/>
    <!-- Tab 1 Active: Home -->
    <circle cx="50" cy="28" r="4" fill="#38bdf8"/>
    <text x="50" y="44" font-family="sans-serif" font-weight="700" font-size="10" fill="#38bdf8" text-anchor="middle">Explore</text>

    <!-- Tab 2: Scanner -->
    <circle cx="130" cy="26" r="16" fill="#0284c7"/>
    <text x="130" y="30" font-family="sans-serif" font-weight="800" font-size="14" fill="#fff" text-anchor="middle">✦</text>
    <text x="130" y="54" font-family="sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">AI Scan</text>

    <!-- Tab 3: Maps -->
    <text x="210" y="44" font-family="sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Map</text>

    <!-- Tab 4: Community -->
    <text x="285" y="44" font-family="sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Stories</text>

    <!-- Tab 5: Profile -->
    <text x="345" y="44" font-family="sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Saved</text>
  </g>
</svg>
