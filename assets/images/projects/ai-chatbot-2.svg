<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <!-- Window Mockup -->
  <rect width="600" height="400" rx="14" fill="#0b0f19" stroke="#1e293b" stroke-width="1.5"/>
  
  <!-- Header Bar -->
  <rect width="600" height="40" rx="14" fill="#0f172a"/>
  <circle cx="20" cy="20" r="6" fill="#ef4444"/>
  <circle cx="38" cy="20" r="6" fill="#f59e0b"/>
  <circle cx="56" cy="20" r="6" fill="#10b981"/>
  <text x="300" y="25" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94a3b8" text-anchor="middle">Flask RESTful API • POST /api/v1/chat</text>
  
  <!-- API Request Header Bar -->
  <g transform="translate(16, 52)">
    <rect width="568" height="44" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1"/>
    <!-- POST badge -->
    <rect x="12" y="10" width="54" height="24" rx="6" fill="#10b981"/>
    <text x="39" y="26" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="11" fill="#ffffff" text-anchor="middle">POST</text>
    
    <text x="76" y="27" font-family="'JetBrains Mono', monospace" font-size="12" fill="#f8fafc">http://localhost:5000/api/v1/predict</text>
    
    <!-- Status 200 OK badge -->
    <rect x="470" y="10" width="86" height="24" rx="6" fill="#064e3b" stroke="#059669" stroke-width="1"/>
    <text x="513" y="26" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="11" fill="#34d399" text-anchor="middle">200 OK 42ms</text>
  </g>

  <!-- Left: JSON Request Body -->
  <g transform="translate(16, 108)">
    <rect width="276" height="274" rx="10" fill="#111827" stroke="#1f2937" stroke-width="1"/>
    <text x="16" y="26" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="11" fill="#38bdf8">REQUEST PAYLOAD (JSON)</text>
    
    <g transform="translate(16, 44)" font-family="'JetBrains Mono', monospace" font-size="11" fill="#cbd5e1" line-height="1.6">
      <text x="0" y="18" fill="#94a3b8">{</text>
      <text x="16" y="38" fill="#93c5fd">"query"</text><text x="70" y="38" fill="#cbd5e1">: </text><text x="82" y="38" fill="#fde047">"How to build apps?"</text><text x="235" y="38" fill="#cbd5e1">,</text>
      <text x="16" y="58" fill="#93c5fd">"user_id"</text><text x="82" y="58" fill="#cbd5e1">: </text><text x="94" y="58" fill="#fde047">"usr_94821"</text><text x="175" y="58" fill="#cbd5e1">,</text>
      <text x="16" y="78" fill="#93c5fd">"context"</text><text x="82" y="78" fill="#cbd5e1">: </text><text x="94" y="78" fill="#94a3b8">{</text>
      <text x="32" y="98" fill="#93c5fd">"platform"</text><text x="105" y="98" fill="#cbd5e1">: </text><text x="117" y="98" fill="#fde047">"mobile"</text><text x="175" y="98" fill="#cbd5e1">,</text>
      <text x="32" y="118" fill="#93c5fd">"framework"</text><text x="110" y="118" fill="#cbd5e1">: </text><text x="122" y="118" fill="#fde047">"flutter"</text>
      <text x="16" y="138" fill="#94a3b8">}</text>
      <text x="0" y="158" fill="#94a3b8">}</text>
    </g>

    <!-- Architecture tags -->
    <g transform="translate(16, 218)">
      <rect width="244" height="40" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="12" y="18" font-family="sans-serif" font-size="10" fill="#94a3b8">Framework: Flask microservice</text>
      <text x="12" y="32" font-family="sans-serif" font-size="10" fill="#38bdf8">CORS enabled for Web/Flutter</text>
    </g>
  </g>

  <!-- Right: JSON Response Body -->
  <g transform="translate(308, 108)">
    <rect width="276" height="274" rx="10" fill="#111827" stroke="#1f2937" stroke-width="1"/>
    <text x="16" y="26" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="11" fill="#34d399">RESPONSE PAYLOAD (JSON)</text>
    
    <g transform="translate(16, 44)" font-family="'JetBrains Mono', monospace" font-size="11" fill="#cbd5e1">
      <text x="0" y="18" fill="#94a3b8">{</text>
      <text x="16" y="38" fill="#93c5fd">"intent"</text><text x="76" y="38" fill="#cbd5e1">: </text><text x="88" y="38" fill="#34d399">"flutter_guide"</text><text x="200" y="38" fill="#cbd5e1">,</text>
      <text x="16" y="58" fill="#93c5fd">"confidence"</text><text x="105" y="58" fill="#cbd5e1">: </text><text x="117" y="58" fill="#f59e0b">0.964</text><text x="160" y="58" fill="#cbd5e1">,</text>
      <text x="16" y="78" fill="#93c5fd">"entities"</text><text x="90" y="78" fill="#cbd5e1">: </text><text x="102" y="78" fill="#94a3b8">[</text><text x="110" y="78" fill="#fde047">"Flutter"</text><text x="175" y="78" fill="#94a3b8">]</text><text x="183" y="78" fill="#cbd5e1">,</text>
      <text x="16" y="98" fill="#93c5fd">"accuracy_boost"</text><text x="135" y="98" fill="#cbd5e1">: </text><text x="147" y="98" fill="#38bdf8">"+35%"</text><text x="195" y="98" fill="#cbd5e1">,</text>
      <text x="16" y="118" fill="#93c5fd">"training_pairs"</text><text x="140" y="118" fill="#cbd5e1">: </text><text x="152" y="118" fill="#cbd5e1">520,</text>
      <text x="16" y="138" fill="#93c5fd">"reply"</text><text x="68" y="138" fill="#cbd5e1">: </text><text x="80" y="138" fill="#fde047">"Install Flutter SDK..."</text>
      <text x="0" y="158" fill="#94a3b8">}</text>
    </g>

    <!-- Response metadata -->
    <g transform="translate(16, 218)">
      <rect width="244" height="40" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="12" y="18" font-family="sans-serif" font-size="10" fill="#94a3b8">Inference Latency: 42ms</text>
      <text x="12" y="32" font-family="sans-serif" font-size="10" fill="#10b981">Intent Classification Optimized</text>
    </g>
  </g>
</svg>
