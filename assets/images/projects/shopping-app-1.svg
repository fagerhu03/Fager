<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 812" width="100%" height="100%">
  <defs>
    <linearGradient id="shopBanner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="375" height="812" fill="#0f172a"/>

  <!-- Top App Bar -->
  <g transform="translate(24, 52)">
    <text x="0" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="20" fill="#f8fafc">Nova Store</text>
    <text x="0" y="36" font-family="sans-serif" font-size="11" fill="#818cf8">Flutter &amp; Firebase Backend</text>

    <!-- Cart Badge with Item Count -->
    <g transform="translate(285, 4)">
      <circle cx="20" cy="18" r="18" fill="#1e293b"/>
      <text x="20" y="24" font-family="sans-serif" font-size="14" fill="#f8fafc" text-anchor="middle">🛒</text>
      <!-- Count badge -->
      <circle cx="32" cy="8" r="8" fill="#ef4444"/>
      <text x="32" y="11" font-family="sans-serif" font-weight="700" font-size="9" fill="#fff" text-anchor="middle">3</text>
    </g>
  </g>

  <!-- Search Bar -->
  <g transform="translate(24, 105)">
    <rect width="327" height="42" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <circle cx="22" cy="21" r="6" fill="none" stroke="#64748b" stroke-width="2"/>
    <line x1="26" y1="25" x2="32" y2="31" stroke="#64748b" stroke-width="2"/>
    <text x="42" y="25" font-family="sans-serif" font-size="12" fill="#64748b">Search products, tech, electronics...</text>
  </g>

  <!-- Promotional Hero Banner -->
  <g transform="translate(24, 160)">
    <rect width="327" height="135" rx="18" fill="url(#shopBanner)"/>
    <g transform="translate(20, 26)">
      <rect width="65" height="20" rx="6" fill="rgba(255,255,255,0.2)"/>
      <text x="32" y="14" font-family="sans-serif" font-weight="700" font-size="9" fill="#ffffff" text-anchor="middle">LIMITED OFFER</text>
      <text x="0" y="48" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="18" fill="#ffffff">Premium Tech Audio</text>
      <text x="0" y="66" font-family="sans-serif" font-size="11" fill="#e0e7ff">Active Noise Cancellation Headsets</text>
      <rect x="0" y="78" width="90" height="24" rx="12" fill="#ffffff"/>
      <text x="45" y="94" font-family="sans-serif" font-weight="700" font-size="10" fill="#4f46e5" text-anchor="middle">Shop Now ➔</text>
    </g>
    <!-- Headphone illustration -->
    <circle cx="265" cy="67" r="40" fill="rgba(255,255,255,0.1)"/>
    <text x="265" y="80" font-family="sans-serif" font-size="44" fill="#ffffff" text-anchor="middle">🎧</text>
  </g>

  <!-- Category Filter Pills -->
  <g transform="translate(24, 312)">
    <rect x="0" y="0" width="60" height="28" rx="14" fill="#0284c7"/>
    <text x="30" y="18" font-family="sans-serif" font-weight="700" font-size="11" fill="#fff" text-anchor="middle">All</text>

    <rect x="68" y="0" width="75" height="28" rx="14" fill="#1e293b"/>
    <text x="105" y="18" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Headphones</text>

    <rect x="151" y="0" width="68" height="28" rx="14" fill="#1e293b"/>
    <text x="185" y="18" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Watches</text>

    <rect x="227" y="0" width="68" height="28" rx="14" fill="#1e293b"/>
    <text x="261" y="18" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Laptops</text>
  </g>

  <!-- Product Grid -->
  <g transform="translate(24, 355)">
    <text x="0" y="16" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="15" fill="#f8fafc">Popular Products</text>

    <!-- Product 1 -->
    <g transform="translate(0, 26)">
      <rect width="156" height="210" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <rect width="156" height="110" rx="16" fill="#151d2f"/>
      <text x="78" y="65" font-family="sans-serif" font-size="36" fill="#ffffff" text-anchor="middle">🎧</text>
      <text x="12" y="132" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#f8fafc">Pro Wireless ANC</text>
      <text x="12" y="148" font-family="sans-serif" font-size="10" fill="#94a3b8">Audio Gear • Bluetooth 5.3</text>
      <text x="12" y="172" font-family="sans-serif" font-weight="800" font-size="13" fill="#38bdf8">$129.99</text>
      
      <!-- Add Button -->
      <rect x="110" y="156" width="34" height="34" rx="10" fill="#0284c7"/>
      <text x="127" y="178" font-family="sans-serif" font-weight="800" font-size="16" fill="#fff" text-anchor="middle">+</text>
    </g>

    <!-- Product 2 -->
    <g transform="translate(171, 26)">
      <rect width="156" height="210" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <rect width="156" height="110" rx="16" fill="#151d2f"/>
      <text x="78" y="65" font-family="sans-serif" font-size="36" fill="#ffffff" text-anchor="middle">⌚</text>
      <text x="12" y="132" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#f8fafc">Smartwatch Pulse</text>
      <text x="12" y="148" font-family="sans-serif" font-size="10" fill="#94a3b8">Health &amp; GPS Tracking</text>
      <text x="12" y="172" font-family="sans-serif" font-weight="800" font-size="13" fill="#38bdf8">$89.50</text>
      
      <!-- Add Button -->
      <rect x="110" y="156" width="34" height="34" rx="10" fill="#0284c7"/>
      <text x="127" y="178" font-family="sans-serif" font-weight="800" font-size="16" fill="#fff" text-anchor="middle">+</text>
    </g>
  </g>

  <!-- Firebase Sync Status Strip -->
  <g transform="translate(24, 615)">
    <rect width="327" height="42" rx="10" fill="#151d2f" stroke="#0284c7" stroke-width="1"/>
    <text x="14" y="26" font-family="sans-serif" font-size="11" fill="#cbd5e1">🔥 Firebase Firestore &amp; Auth synchronized</text>
  </g>

  <!-- Bottom Nav -->
  <g transform="translate(0, 745)">
    <rect width="375" height="67" fill="#0b0f19"/>
    <text x="60" y="36" font-family="sans-serif" font-weight="700" font-size="11" fill="#38bdf8" text-anchor="middle">Shop</text>
    <text x="187" y="36" font-family="sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Cart (3)</text>
    <text x="315" y="36" font-family="sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Profile</text>
  </g>
</svg>
