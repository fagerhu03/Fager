<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 812" width="100%" height="100%">
  <defs>
    <linearGradient id="islamicHero" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="375" height="812" fill="#061a14"/>

  <!-- Top Bar -->
  <g transform="translate(24, 52)">
    <text x="0" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="20" fill="#f8fafc">Muslim Companion</text>
    <text x="0" y="36" font-family="sans-serif" font-size="11" fill="#34d399">Clean Architecture • Dart &amp; Flutter</text>

    <!-- Language Switcher -->
    <rect x="250" y="6" width="76" height="24" rx="12" fill="#064e3b" stroke="#059669" stroke-width="1"/>
    <text x="288" y="22" font-family="sans-serif" font-weight="700" font-size="10" fill="#ecfdf5" text-anchor="middle">العربية | EN</text>
  </g>

  <!-- Prayer Countdown Card -->
  <g transform="translate(20, 105)">
    <rect width="335" height="170" rx="20" fill="url(#islamicHero)" stroke="#059669" stroke-width="1"/>
    <!-- Crescent & Star accent -->
    <path d="M 285 45 A 25 25 0 1 1 260 70 A 20 20 0 1 0 285 45 Z" fill="#34d399" opacity="0.3"/>
    
    <g transform="translate(22, 28)">
      <text x="0" y="16" font-family="sans-serif" font-weight="600" font-size="11" fill="#6ee7b7" letter-spacing="1">NEXT PRAYER IN 42 MINUTES</text>
      <text x="0" y="52" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="32" fill="#ffffff">Asr • 03:45 PM</text>
      <text x="0" y="76" font-family="sans-serif" font-size="12" fill="#a7f3d0">Cairo, Egypt (GMT+3) • Adhan Alert ON 🔔</text>
      
      <!-- Hijri Date Badge -->
      <g transform="translate(0, 95)">
        <rect width="165" height="26" rx="8" fill="rgba(0,0,0,0.3)"/>
        <text x="82" y="17" font-family="sans-serif" font-weight="600" font-size="11" fill="#ecfdf5" text-anchor="middle">12 Rabi' al-Thani 1447 AH</text>
      </g>
    </g>
  </g>

  <!-- Today's 5 Prayers Grid -->
  <g transform="translate(20, 295)">
    <text x="0" y="16" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="15" fill="#f8fafc">Daily Prayer Times</text>
    
    <!-- Fajr -->
    <g transform="translate(0, 30)">
      <rect width="335" height="52" rx="12" fill="#0b2920" stroke="#059669" stroke-width="0.5"/>
      <text x="20" y="31" font-family="sans-serif" font-weight="700" font-size="14" fill="#ecfdf5">Fajr (Dawn)</text>
      <text x="180" y="31" font-family="sans-serif" font-size="12" fill="#6ee7b7">04:41 AM</text>
      <text x="300" y="31" font-family="sans-serif" font-size="12" fill="#34d399">🔔</text>
    </g>

    <!-- Dhuhr -->
    <g transform="translate(0, 90)">
      <rect width="335" height="52" rx="12" fill="#0b2920" stroke="#059669" stroke-width="0.5"/>
      <text x="20" y="31" font-family="sans-serif" font-weight="700" font-size="14" fill="#ecfdf5">Dhuhr (Noon)</text>
      <text x="180" y="31" font-family="sans-serif" font-size="12" fill="#6ee7b7">12:35 PM</text>
      <text x="300" y="31" font-family="sans-serif" font-size="12" fill="#34d399">🔔</text>
    </g>

    <!-- Asr (Active next) -->
    <g transform="translate(0, 150)">
      <rect width="335" height="52" rx="12" fill="#065f46" stroke="#34d399" stroke-width="1.5"/>
      <text x="20" y="31" font-family="sans-serif" font-weight="800" font-size="14" fill="#ffffff">Asr (Afternoon) ✦</text>
      <text x="180" y="31" font-family="sans-serif" font-weight="700" font-size="13" fill="#34d399">03:45 PM</text>
      <text x="300" y="31" font-family="sans-serif" font-size="12" fill="#facc15">🔔</text>
    </g>

    <!-- Maghrib -->
    <g transform="translate(0, 210)">
      <rect width="335" height="52" rx="12" fill="#0b2920" stroke="#059669" stroke-width="0.5"/>
      <text x="20" y="31" font-family="sans-serif" font-weight="700" font-size="14" fill="#ecfdf5">Maghrib (Sunset)</text>
      <text x="180" y="31" font-family="sans-serif" font-size="12" fill="#6ee7b7">06:22 PM</text>
      <text x="300" y="31" font-family="sans-serif" font-size="12" fill="#34d399">🔔</text>
    </g>

    <!-- Isha -->
    <g transform="translate(0, 270)">
      <rect width="335" height="52" rx="12" fill="#0b2920" stroke="#059669" stroke-width="0.5"/>
      <text x="20" y="31" font-family="sans-serif" font-weight="700" font-size="14" fill="#ecfdf5">Isha (Night)</text>
      <text x="180" y="31" font-family="sans-serif" font-size="12" fill="#6ee7b7">07:42 PM</text>
      <text x="300" y="31" font-family="sans-serif" font-size="12" fill="#34d399">🔔</text>
    </g>
  </g>

  <!-- Quick Feature Banners -->
  <g transform="translate(20, 645)">
    <rect width="160" height="75" rx="14" fill="#0b2920" stroke="#059669" stroke-width="1"/>
    <text x="16" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#ecfdf5">📖 Holy Quran</text>
    <text x="16" y="46" font-family="sans-serif" font-size="10" fill="#6ee7b7">114 Surahs &amp; Audio</text>
    <text x="16" y="62" font-family="sans-serif" font-size="9" fill="#34d399">Read Surah Al-Kahf ➔</text>

    <rect x="175" y="0" width="160" height="75" rx="14" fill="#0b2920" stroke="#059669" stroke-width="1"/>
    <text x="191" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#ecfdf5">📿 Digital Sebha</text>
    <text x="191" y="46" font-family="sans-serif" font-size="10" fill="#6ee7b7">Tasbeeh Counter</text>
    <text x="191" y="62" font-family="sans-serif" font-size="9" fill="#34d399">Subhan Allah (33) ➔</text>
  </g>

  <!-- Bottom Nav -->
  <g transform="translate(0, 745)">
    <rect width="375" height="67" fill="#04120e"/>
    <text x="60" y="36" font-family="sans-serif" font-weight="700" font-size="11" fill="#34d399" text-anchor="middle">Prayers</text>
    <text x="187" y="36" font-family="sans-serif" font-size="11" fill="#6ee7b7" opacity="0.6" text-anchor="middle">Quran</text>
    <text x="315" y="36" font-family="sans-serif" font-size="11" fill="#6ee7b7" opacity="0.6" text-anchor="middle">Sebha</text>
  </g>
</svg>
