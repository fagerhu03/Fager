<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 812" width="100%" height="100%">
  <defs>
    <linearGradient id="mapBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#111c38"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="375" height="812" fill="#090d16"/>

  <!-- Map Header -->
  <g transform="translate(20, 50)">
    <rect width="335" height="42" rx="12" fill="#151d2f" stroke="#2a3852" stroke-width="1"/>
    <text x="16" y="26" font-family="sans-serif" font-size="12" fill="#f8fafc">Search Egypt Landmarks, Cafes, Tours...</text>
    <circle cx="310" cy="21" r="14" fill="#0284c7"/>
    <!-- Filter icon -->
    <text x="310" y="25" font-family="sans-serif" font-size="11" fill="#fff" text-anchor="middle">⚙</text>
  </g>

  <!-- Simulated Interactive Map Canvas -->
  <g transform="translate(20, 105)">
    <rect width="335" height="380" rx="20" fill="url(#mapBg)" stroke="#1e293b" stroke-width="1"/>
    
    <!-- Stylized River Nile path -->
    <path d="M 120 380 Q 140 280 180 200 T 170 80 T 150 0" fill="none" stroke="#0284c7" stroke-width="18" opacity="0.6"/>
    <path d="M 120 380 Q 140 280 180 200 T 170 80 T 150 0" fill="none" stroke="#38bdf8" stroke-width="6" opacity="0.9"/>
    
    <!-- Roads grid -->
    <path d="M 20 180 L 315 160 M 40 260 L 290 280 M 180 40 L 260 360" fill="none" stroke="#1e293b" stroke-width="2"/>

    <!-- Map Pin 1: Pyramids -->
    <g transform="translate(130, 170)">
      <circle cx="0" cy="0" r="18" fill="#e11d48" opacity="0.2"/>
      <circle cx="0" cy="0" r="10" fill="#e11d48"/>
      <text x="0" y="4" font-family="sans-serif" font-size="9" fill="#fff" text-anchor="middle">▲</text>
      <!-- Tooltip -->
      <rect x="-60" y="-38" width="120" height="26" rx="6" fill="#0f172a" stroke="#e11d48" stroke-width="1"/>
      <text x="0" y="-22" font-family="sans-serif" font-weight="700" font-size="10" fill="#fff" text-anchor="middle">Giza Plateau (Active)</text>
    </g>

    <!-- Map Pin 2: NMEC -->
    <g transform="translate(210, 140)">
      <circle cx="0" cy="0" r="8" fill="#0284c7"/>
      <text x="14" y="4" font-family="sans-serif" font-weight="600" font-size="9" fill="#94a3b8">NMEC Museum</text>
    </g>

    <!-- Map Pin 3: Citadel -->
    <g transform="translate(230, 220)">
      <circle cx="0" cy="0" r="8" fill="#0284c7"/>
      <text x="14" y="4" font-family="sans-serif" font-weight="600" font-size="9" fill="#94a3b8">Cairo Citadel</text>
    </g>

    <!-- Floating Navigation controls -->
    <rect x="285" y="280" width="36" height="76" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="303" y="306" font-family="sans-serif" font-size="16" fill="#fff" text-anchor="middle">+</text>
    <line x1="288" y1="318" x2="318" y2="318" stroke="#1e293b"/>
    <text x="303" y="342" font-family="sans-serif" font-size="16" fill="#fff" text-anchor="middle">−</text>
  </g>

  <!-- Community Reviews & Experience Sharing -->
  <g transform="translate(20, 500)">
    <text x="0" y="16" font-family="sans-serif" font-weight="700" font-size="14" fill="#f8fafc">Community Traveler Stories</text>
    <text x="335" y="16" font-family="sans-serif" font-weight="600" font-size="11" fill="#38bdf8" text-anchor="end">+ Share Story</text>

    <!-- Story Card 1 -->
    <g transform="translate(0, 30)">
      <rect width="335" height="85" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <circle cx="32" cy="32" r="16" fill="#0284c7"/>
      <text x="32" y="36" font-family="sans-serif" font-weight="700" font-size="11" fill="#fff" text-anchor="middle">MK</text>
      <text x="58" y="26" font-family="sans-serif" font-weight="700" font-size="12" fill="#fff">Marco &amp; Sarah (Italy)</text>
      <text x="58" y="40" font-family="sans-serif" font-size="10" fill="#94a3b8">"The AI camera scanner instantly told us about the Khafre temple!"</text>
      <text x="58" y="60" font-family="sans-serif" font-weight="700" font-size="10" fill="#eab308">★★★★★ <tspan fill="#64748b" font-weight="400">Yesterday at 4:15 PM</tspan></text>
      <text x="295" y="60" font-family="sans-serif" font-size="10" fill="#38bdf8">❤️ 42</text>
    </g>

    <!-- Story Card 2 -->
    <g transform="translate(0, 125)">
      <rect width="335" height="75" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <circle cx="32" cy="32" r="16" fill="#10b981"/>
      <text x="32" y="36" font-family="sans-serif" font-weight="700" font-size="11" fill="#fff" text-anchor="middle">AH</text>
      <text x="58" y="26" font-family="sans-serif" font-weight="700" font-size="12" fill="#fff">Ahmed H. (Local Guide)</text>
      <text x="58" y="40" font-family="sans-serif" font-size="10" fill="#94a3b8">"Great offline map routing around the Citadel alleys."</text>
      <text x="58" y="58" font-family="sans-serif" font-weight="700" font-size="10" fill="#eab308">★★★★★ <tspan fill="#64748b" font-weight="400">3 days ago</tspan></text>
    </g>
  </g>

  <!-- Bottom Home Bar -->
  <rect x="120" y="795" width="135" height="4" rx="2" fill="#475569"/>
</svg>
