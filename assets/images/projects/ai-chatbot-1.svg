<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <!-- Desktop / Window Frame Mockup -->
  <rect width="600" height="400" rx="14" fill="#0b0f19" stroke="#1e293b" stroke-width="1.5"/>
  
  <!-- Window Header / Title Bar -->
  <rect width="600" height="40" rx="14" fill="#0f172a"/>
  <!-- Traffic Light Window Buttons -->
  <circle cx="20" cy="20" r="6" fill="#ef4444"/>
  <circle cx="38" cy="20" r="6" fill="#f59e0b"/>
  <circle cx="56" cy="20" r="6" fill="#10b981"/>
  
  <text x="300" y="25" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94a3b8" text-anchor="middle">NLP Chatbot Studio • Python / NLTK / spaCy</text>
  
  <!-- Content Area: Left Conversation View, Right Intent & Entity Inspector -->
  
  <!-- Left Side: Chat Conversation (width 360) -->
  <g transform="translate(16, 52)">
    <rect width="345" height="332" rx="10" fill="#111827" stroke="#1f2937" stroke-width="1"/>
    
    <!-- User Bubble 1 -->
    <g transform="translate(100, 16)">
      <rect width="230" height="46" rx="12" fill="#0284c7"/>
      <text x="14" y="20" font-family="sans-serif" font-size="11" fill="#ffffff">What are the required courses for</text>
      <text x="14" y="36" font-family="sans-serif" font-size="11" fill="#ffffff">Software Engineering graduation?</text>
    </g>
    
    <!-- Bot Response 1 -->
    <g transform="translate(16, 74)">
      <rect width="310" height="74" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="14" y="22" font-family="sans-serif" font-size="11" fill="#38bdf8" font-weight="700">🤖 Assistant (Intent: degree_requirements)</text>
      <text x="14" y="40" font-family="sans-serif" font-size="11" fill="#e2e8f0">The B.Sc. curriculum requires core tracks in</text>
      <text x="14" y="56" font-family="sans-serif" font-size="11" fill="#e2e8f0">Data Structures, Algorithms, Cloud, and the</text>
      <text x="14" y="70" font-family="sans-serif" font-size="11" fill="#e2e8f0">two-semester Graduation Project.</text>
    </g>

    <!-- User Bubble 2 -->
    <g transform="translate(120, 162)">
      <rect width="210" height="34" rx="12" fill="#0284c7"/>
      <text x="14" y="22" font-family="sans-serif" font-size="11" fill="#ffffff">Can I integrate Flutter with Firebase?</text>
    </g>

    <!-- Bot Response 2 -->
    <g transform="translate(16, 208)">
      <rect width="310" height="66" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="14" y="20" font-family="sans-serif" font-size="11" fill="#38bdf8" font-weight="700">🤖 Assistant (Intent: tech_flutter_firebase)</text>
      <text x="14" y="38" font-family="sans-serif" font-size="11" fill="#e2e8f0">Yes! Flutter integrates with Firebase via</text>
      <text x="14" y="54" font-family="sans-serif" font-size="11" fill="#e2e8f0">firebase_core, Cloud Firestore, and Auth.</text>
    </g>

    <!-- Chat Input Box -->
    <g transform="translate(12, 286)">
      <rect width="321" height="34" rx="10" fill="#0b0f19" stroke="#334155" stroke-width="1"/>
      <text x="14" y="22" font-family="sans-serif" font-size="11" fill="#64748b">Type a message to evaluate NLP intent...</text>
      <rect x="270" y="5" width="44" height="24" rx="6" fill="#0284c7"/>
      <text x="292" y="21" font-family="sans-serif" font-size="11" fill="#fff" text-anchor="middle">Send</text>
    </g>
  </g>

  <!-- Right Side: Intent Classification & NLP Metadata (width 210) -->
  <g transform="translate(372, 52)">
    <rect width="212" height="332" rx="10" fill="#111827" stroke="#1f2937" stroke-width="1"/>
    
    <g transform="translate(14, 16)">
      <text x="0" y="14" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="11" fill="#38bdf8">NLP METRICS</text>
      
      <!-- Training Pairs -->
      <g transform="translate(0, 26)">
        <rect width="184" height="42" rx="8" fill="#1e293b"/>
        <text x="10" y="18" font-family="sans-serif" font-size="9" fill="#94a3b8">TRAINED Q&amp;A PAIRS</text>
        <text x="10" y="34" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="13" fill="#ffffff">500+ Pairs</text>
      </g>

      <!-- Accuracy Enhancement Metric -->
      <g transform="translate(0, 76)">
        <rect width="184" height="44" rx="8" fill="#1e293b"/>
        <text x="10" y="18" font-family="sans-serif" font-size="9" fill="#94a3b8">INTENT CLASSIFICATION</text>
        <text x="10" y="34" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="13" fill="#10b981">+35% Accuracy</text>
      </g>

      <!-- Pipeline Stack -->
      <text x="0" y="142" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="10" fill="#cbd5e1">PIPELINE COMPONENTS</text>
      
      <g transform="translate(0, 154)">
        <rect width="184" height="24" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        <text x="10" y="16" font-family="'JetBrains Mono', monospace" font-size="10" fill="#93c5fd">• NLTK Tokenizer</text>
      </g>
      <g transform="translate(0, 184)">
        <rect width="184" height="24" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        <text x="10" y="16" font-family="'JetBrains Mono', monospace" font-size="10" fill="#93c5fd">• spaCy Lemmatizer</text>
      </g>
      <g transform="translate(0, 214)">
        <rect width="184" height="24" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        <text x="10" y="16" font-family="'JetBrains Mono', monospace" font-size="10" fill="#93c5fd">• TF-IDF Vectorizer</text>
      </g>
      <g transform="translate(0, 244)">
        <rect width="184" height="24" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        <text x="10" y="16" font-family="'JetBrains Mono', monospace" font-size="10" fill="#93c5fd">• Flask API Service</text>
      </g>

      <text x="0" y="292" font-family="sans-serif" font-size="9" fill="#64748b">Verified on test validation split</text>
    </g>
  </g>
</svg>
