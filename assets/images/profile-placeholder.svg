<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="400" rx="32" fill="url(#bgGrad)"/>

  <!-- Blueprint Tech Grid -->
  <g stroke="rgba(255,255,255,0.05)" stroke-width="1">
    <line x1="50" y1="0" x2="50" y2="400"/>
    <line x1="100" y1="0" x2="100" y2="400"/>
    <line x1="150" y1="0" x2="150" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="250" y1="0" x2="250" y2="400"/>
    <line x1="300" y1="0" x2="300" y2="400"/>
    <line x1="350" y1="0" x2="350" y2="400"/>
    <line x1="0" y1="50" x2="400" y2="50"/>
    <line x1="0" y1="100" x2="400" y2="100"/>
    <line x1="0" y1="150" x2="400" y2="150"/>
    <line x1="0" y1="200" x2="400" y2="200"/>
    <line x1="0" y1="250" x2="400" y2="250"/>
    <line x1="0" y1="300" x2="400" y2="300"/>
    <line x1="0" y1="350" x2="400" y2="350"/>
  </g>

  <!-- Accent Circle Halo -->
  <circle cx="200" cy="170" r="105" fill="none" stroke="url(#ringGrad)" stroke-width="2.5" stroke-dasharray="6 4" opacity="0.8" filter="url(#glow)"/>

  <!-- Developer Silhouette -->
  <!-- Shoulders -->
  <path d="M 105 340 C 105 255, 145 230, 200 230 C 255 230, 295 255, 295 340 Z" fill="url(#avatarGrad)" opacity="0.95"/>
  <!-- Head -->
  <circle cx="200" cy="150" r="54" fill="#f8fafc"/>
  
  <!-- Subtle Glasses / Tech Stylization -->
  <path d="M 174 148 Q 186 148 196 150 M 204 150 Q 214 148 226 148" stroke="#0284c7" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  
  <!-- Monogram Initials "FA" in clean typography -->
  <text x="200" y="275" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-weight="800" font-size="18" fill="#ffffff" text-anchor="middle" letter-spacing="2">FA</text>

  <!-- Corner Tech Accents -->
  <path d="M 24 44 L 44 44 L 44 24" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.5"/>
  <path d="M 376 44 L 356 44 L 356 24" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.5"/>
  <path d="M 24 356 L 44 356 L 44 376" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.5"/>
  <path d="M 376 356 L 356 356 L 356 376" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.5"/>
</svg>
